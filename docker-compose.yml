services:
  zende:
    build:
      context: .
      dockerfile: Dockerfile
      # Cache npm downloads between builds; requires BuildKit (default in Docker Desktop).
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: zende
    ports:
      # Default: all interfaces. Set DOCKER_PUBLISH in .env for a specific host IP, e.g. 192.168.1.50:8077:8077
      - "${DOCKER_PUBLISH:-${PORT:-8077}:${PORT:-8077}}"
    environment:
      # Required for Prisma (SQLite). Path must match the volume mount below.
      DATABASE_URL: "file:/data/zende.db"
      # DVR MP4 output — must stay on the persisted `/data` volume (same as DATABASE_URL).
      ZENDE_RECORDINGS_DIR: "/data/recordings"
      # Subtitle VTT + search cache (7-day TTL) — same volume so it survives rebuilds.
      ZENDE_SUBTITLES_DIR: "/data/subtitles"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_PRETTY: "${LOG_PRETTY:-1}"
      # Dedicated, bounded JSONL error log exposed on the host at ./logs/.
      LOG_ERROR_FILE: "${LOG_ERROR_FILE-/logs/errors.ndjson}"
      LOG_ERROR_MAX_BYTES: "${LOG_ERROR_MAX_BYTES:-10485760}"
      LOG_ERROR_MAX_FILES: "${LOG_ERROR_MAX_FILES:-5}"
      NODE_ENV: production
      PORT: "${PORT:-8077}"
      # Built-in HDHomeRun emulator — off by default; Plex uses Threadfin (:34400) instead.
      ZENDE_HDHR_ENABLED: "${ZENDE_HDHR_ENABLED:-0}"
      ZENDE_HDHR_TUNER_COUNT: "${ZENDE_HDHR_TUNER_COUNT:-4}"
      # ZENDE_HDHR_FRIENDLY_NAME: "Zende IPTV"
      # ZENDE_HDHR_DEVICE_ID: "A1B2C3D4"  # 8 hex chars; auto-derived if unset
      # ZENDE_HDHR_MAX_CHANNELS: "5000"   # optional cap — Plex may choke on huge lineups

      # ── Threadfin (Plex / Jellyfin Live TV DVR) ─────────────────────────────
      # Sidecar pulls Zende's full Live+Movies+Series M3U and exposes HDHomeRun on :34400.
      # Plex → Settings → Live TV & DVR → Set Up Plex DVR → HDHomeRun → host:34400
      ZENDE_THREADFIN_URL: "${ZENDE_THREADFIN_URL:-http://threadfin:34400}"
      ZENDE_THREADFIN_PUBLIC_HOST: "${ZENDE_THREADFIN_PUBLIC_HOST:-}"
      ZENDE_THREADFIN_PUBLIC_BASE_URL: "${ZENDE_THREADFIN_PUBLIC_BASE_URL:-}"
      ZENDE_THREADFIN_PUBLIC_PORT: "${ZENDE_THREADFIN_PUBLIC_PORT:-34400}"
      # Threadfin hard-codes Plex's lineup ceiling at 480 channels.
      ZENDE_THREADFIN_MAX_CHANNELS: "${ZENDE_THREADFIN_MAX_CHANNELS:-480}"
      ZENDE_THREADFIN_SYNC: "${ZENDE_THREADFIN_SYNC:-1}"
      ZENDE_THREADFIN_TUNER_COUNT: "${ZENDE_THREADFIN_TUNER_COUNT:-4}"
      # Internal origin Threadfin uses to fetch playlist/EPG (Docker DNS).
      ZENDE_THREADFIN_SOURCE_ORIGIN: "${ZENDE_THREADFIN_SOURCE_ORIGIN:-http://zende:8077}"
      # Shared conf volume path inside this container (seed settings.json).
      ZENDE_THREADFIN_CONF_DIR: "/threadfin-conf"

      # Optional: force public origin for HLS rewrite if your proxy omits Host / X-Forwarded-* / Forwarded.
      # Normally the same host as get.php is taken from each request automatically.
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-}"
      # Required for production auth: signs JWT access/refresh tokens (Settings → Authentication).
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-zende-local-dev-jwt-secret-change-in-prod}"
      # Optional: Bearer for cron, registry sync, health sweep APIs (Settings → Server).
      # CRON_SECRET: "change-me-to-a-long-random-string"

      # Optional: VOD subtitle search via OpenSubtitles (free API key at opensubtitles.com).
      # WYZIE_API_KEY: "your-wyzie-key"
      # TMDB_API_KEY: "your-tmdb-key"

      # Optional EPG: comma-separated HTTPS XMLTV URLs (e.g. self-hosted guide from
      # https://github.com/iptv-org/epg — publish guide.xml and allowlist the hostname).
      # ZENDE_EPG_GUIDE_URLS: "https://your-host/guide.xml"
      # Optional: extra iptv-org channel ids for GET /api/cron/epg-refresh warm-up.
      # ZENDE_EPG_WARM_IDS: "BBCOne.uk,TSN1.ca"

      # ── VPN proxy (Gluetun) ────────────────────────────────────────────────
      # Absolute HOST path for Gluetun sibling containers. Must be a real host
      # filesystem path (not a named volume) — Docker resolves bind mounts on the
      # host daemon, not inside this container.
      # Set GLUETUN_HOST_WORKDIR in .env before using VPN proxies, e.g.:
      #   GLUETUN_HOST_WORKDIR=/your/host/path/to/gluetun-work
      # If unset, the app falls back to the OS temp dir (local dev only).
      GLUETUN_HOST_WORKDIR: "${GLUETUN_HOST_WORKDIR:-}"
      # Where the same directory is mounted inside *this* container.
      GLUETUN_CONTAINER_WORKDIR: "/gluetun-work"

    volumes:
      # Persists SQLite across container rebuilds.
      - zende-data:/data

      # Host-visible error/fatal logs for periodic stability review.
      - ./logs:/logs

      # Threadfin conf (Zende seeds M3U/XMLTV sources + API settings).
      - threadfin-conf:/threadfin-conf

      # ── Docker socket (required for VPN proxy containers) ──────────────────
      # Allows Zende to start/stop Gluetun sibling containers via the host
      # Docker daemon. Remove this line if you do not use the VPN proxy feature.
      - /var/run/docker.sock:/var/run/docker.sock

      # ── Gluetun config directory ───────────────────────────────────────────
      # Relative path resolves to <project-dir>/gluetun-work when GLUETUN_HOST_WORKDIR
      # is not set. Override with an absolute path via GLUETUN_HOST_WORKDIR in .env.
      # Create the directory first: mkdir -p ./gluetun-work
      - "${GLUETUN_HOST_WORKDIR:-./gluetun-work}:/gluetun-work"

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # M3U → HDHomeRun proxy for Plex / Jellyfin / Emby Live TV.
  # https://github.com/Threadfin/Threadfin
  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    ports:
      - "${THREADFIN_PUBLISH:-34400:34400}"
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=${TZ:-UTC}
    volumes:
      - threadfin-conf:/home/threadfin/conf
      - threadfin-tmp:/tmp/threadfin
    depends_on:
      zende:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zende-data:
    name: zende-data
  threadfin-conf:
    name: threadfin-conf
  threadfin-tmp:
    name: threadfin-tmp
