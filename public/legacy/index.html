<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zende</title>
    <link rel="icon" href="/zende-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/legacy/legacy.css" />
  </head>
  <body>
    <div class="legacy-root">
      <div id="legacy-screen-boot" class="legacy-screen is-active">
        <div class="legacy-loading">Loading Zende…</div>
      </div>

      <div id="legacy-screen-login" class="legacy-screen">
        <div class="legacy-login">
          <h2>Sign in</h2>
          <form id="legacy-login-form">
            <div class="legacy-field">
              <label for="legacy-username">Username</label>
              <input id="legacy-username" name="username" autocomplete="username" />
            </div>
            <div class="legacy-field">
              <label for="legacy-password">Password</label>
              <input
                id="legacy-password"
                name="password"
                type="password"
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="legacy-btn">Sign in</button>
          </form>
          <p class="legacy-login-hint">
            <button id="legacy-modern-login" type="button" class="legacy-link-btn">
              Try full app instead
            </button>
          </p>
        </div>
      </div>

      <div id="legacy-screen-home" class="legacy-screen">
        <header class="legacy-topbar">
          <div class="legacy-topbar-title">
            <h1>Zende <span class="legacy-badge">TV Lite</span></h1>
          </div>
          <nav class="legacy-nav" id="legacy-nav">
            <button type="button" class="legacy-nav-btn is-active" data-tab="home">Home</button>
            <button type="button" class="legacy-nav-btn" data-tab="library">Library</button>
            <button type="button" class="legacy-nav-btn" data-tab="favorites">Favorites</button>
            <button type="button" class="legacy-nav-btn" data-tab="search">Search</button>
          </nav>
          <button id="legacy-modern-btn" type="button" class="legacy-btn legacy-btn-secondary">
            Full app
          </button>
        </header>

        <div id="legacy-search-bar" class="legacy-toolbar is-hidden">
          <input
            id="legacy-search-input"
            type="search"
            placeholder="Search live TV, movies, and shows"
            autocomplete="off"
          />
          <button id="legacy-search-go" type="button" class="legacy-btn">Search</button>
        </div>

        <div id="legacy-library-filters" class="legacy-filter-row is-hidden">
          <button type="button" class="legacy-filter-btn is-active" data-filter="all">All</button>
          <button type="button" class="legacy-filter-btn" data-filter="live">Live</button>
          <button type="button" class="legacy-filter-btn" data-filter="movie">Movies</button>
          <button type="button" class="legacy-filter-btn" data-filter="series">Shows</button>
        </div>

        <div id="legacy-status" class="legacy-status"></div>
        <div id="legacy-shelves" class="legacy-shelves">
          <div class="legacy-loading">Loading channels…</div>
        </div>
      </div>

      <div id="legacy-screen-series" class="legacy-screen">
        <header class="legacy-series-bar">
          <button id="legacy-series-back" type="button" class="legacy-back">Back</button>
          <h2 id="legacy-series-title" class="legacy-series-title">Show</h2>
        </header>
        <div id="legacy-series-status" class="legacy-status"></div>
        <div id="legacy-series-episodes" class="legacy-shelves">
          <div class="legacy-loading">Loading episodes…</div>
        </div>
      </div>

      <div id="legacy-screen-player" class="legacy-screen">
        <div class="legacy-player">
          <div class="legacy-player-bar">
            <button id="legacy-back" type="button" class="legacy-back">Back</button>
            <span id="legacy-player-title" class="legacy-player-title">Playing</span>
          </div>
          <video id="legacy-video" controls playsinline></video>
        </div>
      </div>
    </div>
    <script src="/legacy/hls.min.js"></script>
    <script src="/legacy/legacy.js"></script>
  </body>
</html>
